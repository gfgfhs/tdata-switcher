name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  build:
    name: build exe (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install -r requirements.txt
      - name: Build GUI exe (no console window)
        run: pyinstaller --onefile --windowed --clean --name tdata_switcher --hidden-import tdata_gui --collect-submodules opentele --collect-submodules telethon --hidden-import tgcrypto tdata_switcher.py
      - name: Build console exe
        run: pyinstaller --onefile --console --clean --name tdata_switcher_cli --collect-submodules opentele --collect-submodules telethon --hidden-import tgcrypto tdata_switcher_cli.py
      - name: Smoke test
        shell: pwsh
        run: |
          .\dist\tdata_switcher_cli.exe --version
          .\dist\tdata_switcher_cli.exe --check-session
          if ($LASTEXITCODE -ne 0) { throw "opentele (.session support) is missing from the built exe" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\empty-root" | Out-Null
          .\dist\tdata_switcher_cli.exe --list --root "$env:RUNNER_TEMP\empty-root"
          if ($LASTEXITCODE -ne 0) { throw "tdata_switcher_cli.exe --list failed" }
      - name: SHA256 checksums
        shell: pwsh
        run: |
          Set-Location dist
          Get-ChildItem *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()) *$($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tdata-switcher-windows
          path: |
            dist/tdata_switcher.exe
            dist/tdata_switcher_cli.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tdata-switcher-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tdata_switcher.exe
            dist/tdata_switcher_cli.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
