name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  build:
    name: build exe (Windows)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install -r requirements.txt
      - name: Build GUI exe (no console window)
        run: pyinstaller --onefile --windowed --clean --name tdata_switcher --hidden-import tdata_gui --collect-submodules opentele --collect-submodules telethon --hidden-import tgcrypto tdata_switcher.py
      - name: Build console exe
        run: pyinstaller --onefile --console --clean --name tdata_switcher_cli --collect-submodules opentele --collect-submodules telethon --hidden-import tgcrypto tdata_switcher_cli.py
      # Каждая проверка — отдельный шаг со своим таймаутом: если exe зависнет,
      # сборка упадёт за пару минут и сразу видно, какая именно команда виновата.
      - name: Smoke test - version
        timeout-minutes: 3
        shell: pwsh
        run: |
          $t = Measure-Command { .\dist\tdata_switcher_cli.exe --version | Out-Host }
          "--version: exit=$LASTEXITCODE, $([math]::Round($t.TotalSeconds, 1)) s"
          if ($LASTEXITCODE -ne 0) { throw "tdata_switcher_cli.exe --version failed" }
      - name: Smoke test - .session support (opentele)
        timeout-minutes: 3
        shell: pwsh
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          # stdin закрыт: если программа вдруг ждёт ввод, она упадёт, а не повиснет.
          $t = Measure-Command { $null | .\dist\tdata_switcher_cli.exe --check-session | Out-Host }
          "--check-session: exit=$LASTEXITCODE, $([math]::Round($t.TotalSeconds, 1)) s"
          if ($LASTEXITCODE -ne 0) { throw "opentele (.session support) is missing from the built exe or hung on import" }
      - name: Smoke test - list
        timeout-minutes: 3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\empty-root" | Out-Null
          $null | .\dist\tdata_switcher_cli.exe --list --root "$env:RUNNER_TEMP\empty-root"
          if ($LASTEXITCODE -ne 0) { throw "tdata_switcher_cli.exe --list failed" }
      - name: SHA256 checksums
        shell: pwsh
        run: |
          Set-Location dist
          Get-ChildItem *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()) *$($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tdata-switcher-windows
          path: |
            dist/tdata_switcher.exe
            dist/tdata_switcher_cli.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tdata-switcher-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tdata_switcher.exe
            dist/tdata_switcher_cli.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
